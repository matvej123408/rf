<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Tracking</title>

<style>
body {
  margin:0;
  background:black;
  color:white;
  text-align:center;
  font-family:sans-serif;
}

video, canvas {
  width:100%;
  max-width:500px;
}

.container {
  position:relative;
  display:inline-block;
}

canvas {
  position:absolute;
  top:0;
  left:0;
}

button {
  margin:5px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#1e293b;
  color:white;
}
</style>
</head>

<body>

<h3>🎯 Tracking System</h3>

<div class="container">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<br>

<button id="startBtn">🚀 Запустить</button>
<button id="camBtn">🔄 Камера</button>

<p id="status">Нажми Запустить</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script src="app.js"></script>

</body>
</html>
